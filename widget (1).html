<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Compliance Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f5f6fa; color: #1a1a2e; padding: 20px; }
        h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }
        .cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
        .card { background: white; border-radius: 10px; padding: 16px; border-top: 4px solid; }
        .card.red { border-color: #e74c3c; } .card.yellow { border-color: #f39c12; } .card.green { border-color: #27ae60; }
        .card-num { font-size: 28px; font-weight: 700; }
        .card.red .card-num { color: #e74c3c; } .card.yellow .card-num { color: #f39c12; } .card.green .card-num { color: #27ae60; }
        .card-lbl { font-size: 11px; color: #888; text-transform: uppercase; margin-top: 4px; }
        .filters { display: flex; gap: 8px; margin-bottom: 14px; }
        .btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: white; font-size: 12px; cursor: pointer; color: #555; }
        .btn.active { background: #3498db; color: white; border-color: #3498db; }
        .btn.red.active { background: #e74c3c; border-color: #e74c3c; }
        .btn.yellow.active { background: #f39c12; border-color: #f39c12; }
        .btn.green.active { background: #27ae60; border-color: #27ae60; }
        .table-wrap { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        thead th { padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #888; background: #f9f9f9; border-bottom: 1px solid #eee; cursor: pointer; }
        tbody tr { border-bottom: 1px solid #f2f2f2; } tbody tr:hover { background: #fafafa; }
        td { padding: 11px 14px; font-size: 13px; }
        .name { font-weight: 600; } .doc { color: #666; font-size: 12px; } .mono { font-family: monospace; font-size: 12px; }
        .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge.expired { background: #fde8e8; color: #c0392b; }
        .badge.warning { background: #fef3e2; color: #d68910; }
        .badge.valid { background: #e8f8f0; color: #1e8449; }
        .badge.nodate { background: #f0f0f0; color: #888; }
        #loader { text-align: center; padding: 40px; color: #888; }
        .empty { text-align: center; padding: 30px; color: #aaa; font-size: 13px; }
        .footer { text-align: right; font-size: 11px; color: #aaa; margin-top: 10px; }
        .error { text-align: center; padding: 20px; color: #e74c3c; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Driver Compliance Dashboard</h1>
    <p class="subtitle">Live driver document expiration tracker</p>
    <div class="cards">
        <div class="card red"><div class="card-num" id="cnt-exp">—</div><div class="card-lbl">Expired</div></div>
        <div class="card yellow"><div class="card-num" id="cnt-warn">—</div><div class="card-lbl">Expiring within 30 days</div></div>
        <div class="card green"><div class="card-num" id="cnt-ok">—</div><div class="card-lbl">Valid</div></div>
    </div>
    <div class="filters">
        <button class="btn active" onclick="doFilter('all',this)">All</button>
        <button class="btn red" onclick="doFilter('expired',this)">Expired</button>
        <button class="btn yellow" onclick="doFilter('warning',this)">Expiring Soon</button>
        <button class="btn green" onclick="doFilter('valid',this)">Valid</button>
    </div>
    <div class="table-wrap">
        <div id="loader">Loading driver data...</div>
        <table id="tbl" style="display:none">
            <thead><tr>
                <th onclick="doSort('name',this)">Driver ↕</th>
                <th onclick="doSort('doc',this)">Document ↕</th>
                <th onclick="doSort('days',this)">Expiry Date ↕</th>
                <th onclick="doSort('days',this)">Days Left ↕</th>
                <th>Status</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty" style="display:none">No records match this filter.</div>
        <div id="error" class="error" style="display:none"></div>
    </div>
    <div class="footer" id="footer"></div>

<script src="https://js.zohostatic.com/zohopeople/1.0/zohopeople.js"></script>
<script>
var rows=[], curFilter='all', sortCol='days', sortAsc=true;
var DOCS=[
    {label:'Driver License',field:'drivers_license_expiration_date'},
    {label:'MVR Report',field:'mvr_report_expiration_date'},
    {label:'DOT Medical Card',field:'dot_medical_card_expiration_date'},
    {label:'Drug Test',field:'drug_test_expiration_date'}
];
var MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

function parseDays(d){
    if(!d) return null;
    var p=d.split('-');
    if(p.length!==3) return null;
    var dt=new Date(parseInt(p[2]),MONTHS[p[1]],parseInt(p[0]));
    var today=new Date(); today.setHours(0,0,0,0);
    return Math.floor((dt-today)/86400000);
}

function getStatus(days){
    if(days===null) return 'nodate';
    if(days<0) return 'expired';
    if(days<=30) return 'warning';
    return 'valid';
}

function render(){
    var filtered=rows.filter(function(r){ return curFilter==='all'||r.status===curFilter; });
    filtered.sort(function(a,b){
        var va=sortCol==='name'?a.name:sortCol==='doc'?a.doc:(a.days===null?9999:a.days);
        var vb=sortCol==='name'?b.name:sortCol==='doc'?b.doc:(b.days===null?9999:b.days);
        return sortAsc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);
    });
    if(!filtered.length){
        document.getElementById('empty').style.display='block';
        document.getElementById('tbl').style.display='none';
        return;
    }
    document.getElementById('empty').style.display='none';
    document.getElementById('tbl').style.display='table';
    document.getElementById('tbody').innerHTML=filtered.map(function(r){
        var dl=r.days===null?'—':r.days<0?Math.abs(r.days)+' days ago':r.days+' days';
        var bl={expired:'Expired',warning:'Expiring Soon',valid:'Valid',nodate:'No Date'}[r.status];
        return '<tr><td><div class="name">'+r.name+'</div></td><td><div class="doc">'+r.doc+'</div></td>'+
            '<td><div class="mono">'+(r.date||'—')+'</div></td>'+
            '<td><div class="mono">'+dl+'</div></td>'+
            '<td><span class="badge '+r.status+'">'+bl+'</span></td></tr>';
    }).join('');
}

function doFilter(f,btn){
    curFilter=f;
    document.querySelectorAll('.btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    render();
}

function doSort(col){
    sortAsc=sortCol===col?!sortAsc:true;
    sortCol=col;
    render();
}

function loadData(employees){
    var exp=0,warn=0,ok=0;
    employees.forEach(function(emp){
        var name=((emp.FirstName||emp['First Name']||'')+' '+(emp.LastName||emp['Last Name']||'')).trim();
        if(!name) return;
        DOCS.forEach(function(d){
            var date=emp[d.field];
            if(!date) return;
            var days=parseDays(date);
            var status=getStatus(days);
            if(status==='expired') exp++;
            else if(status==='warning') warn++;
            else if(status==='valid') ok++;
            rows.push({name:name,doc:d.label,date:date,days:days,status:status});
        });
    });
    document.getElementById('cnt-exp').textContent=exp;
    document.getElementById('cnt-warn').textContent=warn;
    document.getElementById('cnt-ok').textContent=ok;
    document.getElementById('loader').style.display='none';
    document.getElementById('footer').textContent='Last updated: '+new Date().toLocaleString();
    if(rows.length===0){
        document.getElementById('empty').style.display='block';
        document.getElementById('empty').textContent='No expiration dates found. Please fill in driver document dates in Zoho People.';
    } else { render(); }
}

function showError(msg){
    document.getElementById('loader').style.display='none';
    document.getElementById('error').style.display='block';
    document.getElementById('error').textContent='Debug: '+msg;
}

ZOHO.embeddedApp.on("PageLoad", function(data){
    ZOHO.PEOPLE.API.getRecords({formName:"employee",page:1,pageSize:200})
    .then(function(resp){
        var employees=resp && resp.data ? resp.data : (Array.isArray(resp) ? resp : []);
        loadData(employees);
    }).catch(function(e){
        showError(JSON.stringify(e));
    });
});

ZOHO.embeddedApp.init();
</script>
</body>
</html>
